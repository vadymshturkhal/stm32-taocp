name: Elevator (C)

on:
  push:
    paths:
      - 'elevator/C_Native/**'
      - 'elevator/Measurements/trace_*.txt'
      - '.github/workflows/elevator-c.yml'
  pull_request:
    paths:
      - 'elevator/C_Native/**'
      - 'elevator/Measurements/trace_*.txt'
      - '.github/workflows/elevator-c.yml'
  workflow_dispatch:

jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build elevator_sim (traced)
        working-directory: elevator/C_Native
        run: make elevator_sim

      - name: Compare against trace output (0 users)
        working-directory: elevator/C_Native
        run: ./elevator_sim 0 | diff - ../Measurements/trace_0.txt

      - name: Compare against trace output (1 user)
        working-directory: elevator/C_Native
        run: ./elevator_sim 1 | diff - ../Measurements/trace_1.txt

      - name: Compare against trace output (4 users)
        working-directory: elevator/C_Native
        run: ./elevator_sim 4 | diff - ../Measurements/trace_4.txt

      - name: Compare against trace output (26 users)
        working-directory: elevator/C_Native
        run: ./elevator_sim 26 | diff - ../Measurements/trace_26.txt

      - name: Compare against trace output (500 users)
        working-directory: elevator/C_Native
        run: ./elevator_sim 500 | diff - ../Measurements/trace_500.txt

      - name: Build elevator_sim_notrace
        working-directory: elevator/C_Native
        run: make elevator_sim_notrace

      - name: Smoke test elevator_sim_notrace (must run without crashing, no output expected)
        working-directory: elevator/C_Native
        run: |
          output=$(./elevator_sim_notrace 26)
          if [ -n "$output" ]; then
            echo "Expected no output from the notrace build, got:"
            echo "$output"
            exit 1
          fi
