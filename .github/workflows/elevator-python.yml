name: Elevator (Python)

on:
  push:
    paths:
      - 'elevator/python_wait_list/**'
      - 'elevator/measurements/trace_*.txt'
      - '.github/workflows/elevator-python.yml'
  pull_request:
    paths:
      - 'elevator/python_wait_list/**'
      - 'elevator/measurements/trace_*.txt'
      - '.github/workflows/elevator-python.yml'
  workflow_dispatch:

jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Compare against trace output (0 users)
        env:
          TRACE: "1"
        run: |
          python3 elevator/python_wait_list/main.py 0 \
            | diff - elevator/measurements/trace_0.txt

      - name: Compare against trace output (1 user)
        env:
          TRACE: "1"
        run: |
          python3 elevator/python_wait_list/main.py 1 \
            | diff - elevator/measurements/trace_1.txt

      - name: Compare against trace output (4 users)
        env:
          TRACE: "1"
        run: |
          python3 elevator/python_wait_list/main.py 4 \
            | diff - elevator/measurements/trace_4.txt

      - name: Compare against trace output (26 users)
        env:
          TRACE: "1"
        run: |
          python3 elevator/python_wait_list/main.py 26 \
            | diff - elevator/measurements/trace_26.txt

      - name: Compare against trace output (500 users)
        env:
          TRACE: "1"
        run: |
          python3 elevator/python_wait_list/main.py 500 \
            | diff - elevator/measurements/trace_500.txt
